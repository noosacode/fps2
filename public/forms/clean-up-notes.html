<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Up Notes</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/forms.css">
</head>

<body>

    <h1>Clean Up Notes</h1>

    <p>This page will be used to clean up Outside Notes and Inside Notes.</p>

    <h2>Tree</h2>

    <p>Tag: <span id="tree-tag">---</span></p>
    <p>Colour: <span id="tree-colour">---</span></p>
    <p>Bag Size: <span id="tree-bag-size">---</span></p>
    <p>WC Status: <span id="tree-wc-status">---</span></p>

    <h2>Notes</h2>

    <label for="note">Note</label><br>
    <textarea id="note" rows="4" cols="60"></textarea>

    <br><br>

    <label for="general-notes">General Notes</label><br>
    <textarea id="general-notes" rows="4" cols="60"></textarea>

    <br><br>

    <label for="outside-notes">Outside Notes</label><br>
    <textarea id="outside-notes" rows="4" cols="60"></textarea>

    <br><br>

    <label for="inside-notes">Inside Notes</label><br>
    <textarea id="inside-notes" rows="4" cols="60"></textarea>

    <br><br>

    <button id="save-button">Save changes</button>

    <script src="/forms/clean-up-notes.js"></script>

</body>
</html>
