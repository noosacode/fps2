<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Tree</title>
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/forms.css">
</head>

<header class="app-header">
  <nav class="nav-bar">
        <div class="nav-left">
          <a href="/index.html">Home</a>
          <a href="/forms/find-tree.html">Find Tree</a>
          <a href="/tree-data/tools.html">Tools</a>
          <a href="/lists/lists.html">Lists</a>
          <a href="/lists/menu.html">Menu</a>
        </div>

    <div class="nav-right">
      <span class="logo">Frangipani Trees</span>
    </div>
  </nav>
</header>

<body>
  <h1 id="page-title">Edit Tree</h1>
  <div id="loading">Loading…</div>
  <p id="message" class="message" role="alert"></p>
  <form id="tree-form" hidden>
    <label>Tree tag <input id="tag" name="tag" readonly></label>
    <label>Position <input name="position" type="number" step="1"></label>
    <label>
      Colour
      <select name="colour">
        <option value="Not recorded">Not recorded yet</option>
        <option value="Aztec Gold">Aztec Gold</option>
        <option value="Blackjack">Blackjack</option>
        <option value="Bubblegum Dream">Bubblegum Dream</option>
        <option value="Buttercup">Buttercup</option>
        <option value="California Sunset">California Sunset</option>
        <option value="Candy Rainbow">Candy Rainbow</option>
        <option value="Caracasana">Caracasana</option>
        <option value="Cindy Moragne">Cindy Moragne</option>
        <option value="Coconut Pink">Coconut Pink</option>
        <option value="Cuba">Cuba</option>
        <option value="Fiesta">Fiesta</option>
        <option value="George Brown">George Brown</option>
        <option value="Hot Pink">Hot Pink</option>
        <option value="Lemon Drop">Lemon Drop</option>
        <option value="Mystery">Mystery</option>
        <option value="Petite Pink">Petite Pink</option>
        <option value="Petite White">Petite White</option>
        <option value="Pink">Pink</option>
        <option value="Pink Sunrise">Pink Sunrise</option>
        <option value="Pudica Pink">Pudica Pink</option>
        <option value="Pudica White">Pudica White</option>
        <option value="Razzmic Honey">Razzmic Honey</option>
        <option value="Red (Red Bull)">Red (Red Bull)</option>
        <option value="Ruby Gold">Ruby Gold</option>
        <option value="Sharna's Rose">Sharna's Rose</option>
        <option value="Singapore">Singapore</option>
        <option value="Stenophylla">Stenophylla</option>
        <option value="Sunset">Sunset</option>
        <option value="Tricolour">Tricolour</option>
        <option value="Unknown">Unknown</option>
        <option value="Venus">Venus</option>
        <option value="White (cream)">White (cream)</option>
        <option value="Yellow (Heidi)">Yellow (Heidi)</option>
        <!-- Add new permanent colours here as needed -->
        <option value="Other">Other</option>
      </select>
    </label>
    <label>
      WooCommerce status
      <select name="wcStatus">
        <option value="Never added to WC">Never added to WC</option>
        <option value="on">on</option>
        <option value="off">off</option>
        <option value="sold - on">sold - on</option>
        <option value="sold - off">sold - off</option>
      </select>
    </label>
    <label>
      WooCommerce last changed
      <input type="date" name="wcLastChanged">
      <input type="checkbox" name="clearWcLastChanged">
    </label>
    <label>
      Sell Score
      <select name="sellScore" disabled>
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
      </select>
    </label>
    <label>
      Feature
      <select name="feature">
        <option value="sellScore">Sell Score</option>
        <option value="bentTrunk">Bent Trunk</option>
        <option value="cutoffBranch">Cutoff Branch</option>
        <option value="fertilize">Fertilize</option>
        <option value="flowerColourUnknown">Flower Colour Unknown</option>
        <option value="fruitSpottingBug">Fruir Spotting Bug</option>
        <option value="gatherStats">Gather Stats</option>
        <option value="getPhoto">Get Photo</option>
        <option value="health">Health</option>
        <option value="ingroundRoots">Inground Roots</option>
        <option value="leafProblem">Leaf Problem</option>
        <option value="lichen">Lichen</option>
        <option value="lowSoil">Low Soil</option>
        <option value="prune">Prune</option>
        <option value="rootsStrength">Roots Strength</option>
        <option value="rust">Rust</option>
        <option value="skinnyShape">Skinny Shape</option>
        <option value="smallSize">Small Size</option>
        <option value="softBranch">Soft Branch</option>
        <option value="stringed">Stringed</option>
        <option value="sunburnt">Sunburnt</option>
        <option value="tipDamage">Tip Damage</option>
        <option value="unbalancedShape">Unbalanced Shape</option>
        <option value="upsize">Upsize</option>
        <option value="whiteScale">White Scale</option>
      </select>
    </label>
    <label>
      Feature Score
      <select name="featureScore">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
      </select>
    </label>
    <label>
      Bag size
      <select name="bagSize">       
        <option value="0">0</option>
        <option value="250">250</option>
        <option value="300">300</option>
        <option value="350">350</option>
        <option value="400">400</option>
        <option value="500">500</option>
        <option value="25">25</option>
        <option value="35">35</option>
        <option value="45">45</option>
        <option value="75">75</option>
        <option value="100">100</option>
        <option value="150">150</option>
        <option value="200">200</option>
      </select>
    </label>
    <label>Price <input name="price" type="number" step="10"></label>
    <label>
      Photo quality
      <select name="photoQuality">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
      </select>
    </label>
    <label>
      Best photo date
      <input type="date" name="bestPhotoDate">
      <input type="checkbox" name="clearBestPhotoDate">
    </label>
    <label>Recent photo date 
      <input name="recentPhotoDate" type="date">
      <input type="checkbox" name="clearRecentPhotoDate">
    </label>
    <label>
      Transport size
      <select name="transportSize">
        <option value="Not recorded">Not recorded</option>       
        <option value="standard">standard</option>
        <option value="tall">tall</option>
        <option value="oversized">oversized</option>
      </select>
    </label>
    <label>
      Relative size
      <select name="relativeSize">
        <option value="Not recorded">Not recorded</option>
        <option value="XXS">XXS</option>
        <option value="XS">XS</option>
        <option value="MS">MS</option>
        <option value="ML">ML</option>
        <option value="XL">XL</option>
        <option value="XXL">XXL</option>
        <option value="XXXL">XXXL</option>
      </select>
    </label>
    <label>
      Soil percent
      <select name="soilPercent">
        <option value="0">0</option>
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="40">40</option>
        <option value="50">50</option>
        <option value="60">60</option>
        <option value="70">70</option>
        <option value="80">80</option>
        <option value="90">90</option>
      </select>
    </label>
    <label>Date added <input name="dateAdded" type="date" readonly></label>
    <label>
      Notes
      <textarea name="notes"></textarea>
    </label>
    <label>
      Delete notes
      <input type="checkbox" name="deleteNotes">
    </label>
    <label>
      General notes
      <textarea name="notesGeneral"></textarea>
    </label>
    <label>
      Delete general notes
      <input type="checkbox" name="deleteNotesGeneral">
    </label>
    <label>
      Outside tasks
      <select name="outsideTasks">
        <option value="">Select an outside task</option>
        <option value="See notes">See notes</option>
        <option value="Ant Sand">Ant Sand</option>
        <option value="Bag size (get)">Bag size (get)</option>
        <option value="Colour tag (get)">Colour tag (get)</option>
        <option value="Crop">Crop</option>
        <option value="Cut roots">Cut roots</option>
        <option value="Fertilize">Fertilize</option>
        <option value="I colour tag (insert)">I colour tag (insert)</option>
        <option value="I number tag (insert)">I number tag (insert)</option>
        <option value="Irrigation repair">Irrigation repair</option>
        <option value="M down (move down)">M down (move down)</option>
        <option value="M up (move up)">M up (move up)</option>
        <option value="Number tag (get)">Number tag (get)</option>
        <option value="Photo">Photo</option>
        <option value="Popup">Popup</option>
        <option value="Position (get)">Position (get)</option>
        <option value="Prune">Prune</option>
        <option value="Saw">Saw</option>
        <option value="Sell score (get)">Sell score (get)</option>
        <option value="Soil level (get)">Soil level (get)</option>
        <option value="Stats (get)">Stats (get)</option>
        <option value="String (train with string)">String (train with string)</option>
        <option value="Transport height (get)">Transport height (get)</option>
        <option value="Upsize">Upsize</option>
        <option value="Value (get)">Value (get)</option>
        <option value="Wash lichen">Wash lichen</option>
      </select>
    </label>
    <label>
      Inside tasks
      <select name="insideTasks">
        <option value="">Select an inside task</option>
        <option value="See notes">See notes</option>
        <option value="Add \" reserved\" to title">Add "reserved" to title</option>
        <option value="Add sold to title - leave published">Add sold to title - leave published</option>
        <option value="Add sold to title - turn off / draft">Add sold to title - turn off / draft</option>
        <option value="Crop">Crop</option>
        <option value="Get photo ready">Get photo ready</option>
        <option value="Turn back on">Turn back on</option>
        <option value="Turn off">Turn off</option>
        <option value="Turn off 1 month after sale">Turn off 1 month after sale</option>
        <option value="Turn on">Turn on</option>
        <option value="Turn on urgently">Turn on urgently</option>
        <option value="Update photo">Update photo</option>
        <option value="Update price">Update price</option>
        <option value="Update something else">Update something else</option>
        <option value="Watermark">Watermark</option>
      </select>
    </label>
    <button type="submit">Save changes</button><button id="search-button" type="button">Search for another tree</button>
  </form>

  <script src="/js/shared-frontend.js"></script>
  <script src="/forms/edit-tree.js"></script>
</body>

</html>
