<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Tree</title>
  <link rel="stylesheet" href="/css/tree-workflow.css">
</head>

<body>
  <nav><a href="/index.html">Home</a></nav>
  <h1 id="page-title">Edit Tree</h1>
  <p id="message" class="message" role="alert"></p>
  <form id="tree-form" hidden>
    <label>Tree tag <input id="tag" name="tag" readonly></label>
    <label>Position <input name="position" type="number" step="1"></label>
    <label>Colour <input name="colour"></label>
    <label>
      WooCommerce status
      <select name="wcStatus">
        <option value="Never added to WC">Never added to WC</option>
        <option value="on">on</option>
        <option value="off">off</option>
        <option value="sold - on">sold - on</option>
        <option value="sold - off">sold - off</option>
      </select>
    </label>
    <label>WooCommerce last changed <input name="wcLastChanged" type="date"></label>
    <label>
      Sell Score
      <select name="sellScore">
        <option value="0">0</option>       
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
      </select>
    </label>
    <label>
      Bag size
      <select name="bagSize">
        <option value="250">250</option>
        <option value="300">300</option>
        <option value="350">350</option>
        <option value="400">400</option>
        <option value="500">500</option>
        <option value="25">25</option>
        <option value="35">35</option>
        <option value="45">45</option>
        <option value="75">75</option>
        <option value="100">100</option>
        <option value="150">150</option>
        <option value="200">200</option>
      </select>
    </label>
    <label>Price <input name="price" type="number" step="0.01"></label>
    <label>
      Photo quality
      <select name="photoQuality">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
      </select>
    </label>
    <label>Best photo date <input name="bestPhotoDate" type="date"></label>
    <label>Recent photo date <input name="recentPhotoDate" type="date"></label>
    <label>
      Transport size
      <select name="transportSize">
        <option value="standard">standard</option>
        <option value="tall">tall</option>
        <option value="oversized">oversized</option>
      </select>
    </label>

    <label>
      Relative size
      <select name="relativeSize">
        <option value="XXS">XXS</option>
        <option value="XS">XS</option>
        <option value="MS">MS</option>
        <option value="ML">ML</option>
        <option value="XL">XL</option>
        <option value="XXL">XXL</option>
        <option value="XXXL">XXXL</option>
      </select>
    </label>
    <label>
      Soil percent
      <select name="soilPercent">
        <option value="0">0</option>
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="40">40</option>
        <option value="50">50</option>
        <option value="60">60</option>
        <option value="70">70</option>
        <option value="80">80</option>
        <option value="90">90</option>
      </select>
    </label>
    <label>Date added <input name="dateAdded" type="date" readonly></label>
    <label>Notes <textarea name="notes"></textarea></label>
    <label>General notes <textarea name="notesGeneral"></textarea></label>
    <label>Outside notes <textarea name="notesOutside"></textarea></label>
    <label>Inside notes <textarea name="notesInside"></textarea></label>
    <button type="submit">Save changes</button><button id="search-button" type="button">Search for another tree</button>
  </form>

  <script src="/js/shared-frontend.js"></script>
  <script src="/forms/edit-tree.js"></script>
  
</body>

</html>
