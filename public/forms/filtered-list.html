<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Filtered List</title>
    <link rel="stylesheet" href="/css/tree-workflow.css">
</head>

<body>
    <nav>
        <a href="/index.html">Home</a>
    </nav>

    <h1>Filtered list</h1>

    <!-- Filtering fields follow the same pattern as other forms -->
    <form id="filtered-list-form" novalidate>
        <label for="tagContains">
            Tag contains
            <input id="tagContains" name="tagContains" type="text" autocomplete="off" placeholder="e.g. 12w or 560">
        </label>

        <label for="colour">
            Colour
            <input id="colour" name="colour" type="text" autocomplete="off" placeholder="e.g. White">
        </label>

        <label for="wcStatus">
            WooCommerce status
            <input id="wcStatus" name="wcStatus" type="text" autocomplete="off" placeholder="e.g. In stock">
        </label>

        <label for="bagSize">
            Bag size
            <input id="bagSize" name="bagSize" type="text" autocomplete="off" placeholder="e.g. 3-gallon">
        </label>

        <label for="firstPosition">
            Position from
            <input id="firstPosition" name="firstPosition" type="number" min="101" max="999999" autocomplete="off"
                required>
        </label>

        <label for="lastPosition">
            to
            <input id="lastPosition" name="lastPosition" type="number" min="101" max="999999" autocomplete="off"
                required>
        </label>

        <label for="minSellScore">
            Minimum sell score
            <input id="minSellScore" name="minSellScore" type="number" min="0" step="1" placeholder="0">
        </label>

        <label for="notesContains">
            Notes
            <input id="notesContains" name="notesContains" type="text" autocomplete="off" placeholder="search notes">
        </label>

<label>
     Notes (General) is not empty
    <input type="checkbox" id="notesGeneralNotEmpty" name="notesGeneralNotEmpty">
</label>


        <label for="notesOutsideContains">
            Outside notes
            <input id="notesOutsideContains" name="notesOutsideContains" type="text" autocomplete="off"
                placeholder="search outside notes">
        </label>

        <label for="notesInsideContains">
            Inside notes
            <input id="notesInsideContains" name="notesInsideContains" type="text" autocomplete="off"
                placeholder="search inside notes">
        </label>

        <div>
            <button type="submit">Search</button>
            <button type="button" id="clearBtn">Clear</button>
        </div>
    </form>

    <p id="message" class="message" role="alert"></p>

    <div id="results"></div>

    <script src="/forms/filtered-list.js"></script>
</body>

</html>
