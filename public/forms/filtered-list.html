<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Filtered List</title>
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/forms.css">
</head>

<header class="app-header">
    <nav class="nav-bar">
        <div class="nav-left">
            <a href="/index.html">Home</a>
            <a href="/tree-data/tools.html">Tools</a>
            <a href="/lists/lists.html">Lists</a>
            <a href="/lists/menu.html">Menu</a>
        </div>

        <div class="nav-right">
            <span class="logo">Frangipani Trees</span>
        </div>
    </nav>
</header>

<body>
    <h1>Filtered Search</h1>

    <!-- Filtering fields follow the same pattern as other forms -->
    <form id="filtered-list-form" novalidate>
        <label for="tagContains">
            Tag contains
            <input id="tagContains" name="tagContains" type="text" autocomplete="off" placeholder="e.g. 12w or 560">
        </label>

        <label for="colour">
            Colour
            <input id="colour" name="colour" type="text" autocomplete="off" placeholder="e.g. White">
        </label>
        <label for="wcStatusSelect">
            WooCommerce status
            <select name="wcStatus" id="wcStatus">
                <option value="">All</option>
                <option value="Never added to WC">Never added to WC</option>
                <option value="on">on</option>
                <option value="off">off</option>
                <option value="sold - on">sold - on</option>
                <option value="sold - off">sold - off</option>
            </select>
        </label>     
        <label for="bagSize">
            Bag size
            <input id="bagSize" name="bagSize" type="text" autocomplete="off" placeholder="e.g. 3-gallon">
        </label>

        <label for="firstPosition">
            Position from
            <input id="firstPosition" name="firstPosition" type="number" min="10" max="999999" autocomplete="off"
                required>
        </label>

        <label for="lastPosition">
            to
            <input id="lastPosition" name="lastPosition" type="number" min="99" max="999999" autocomplete="off"
                required>
        </label>

        <label for="minSellScore">
            Minimum sell score
            <input id="minSellScore" name="minSellScore" type="number" min="0" step="1" placeholder="0">
        </label>
        
        <label for="maxSellScore">
            Maximum sell score
            <input id="maxSellScore" name="maxSellScore" type="number" min="0" step="1" placeholder="9">
        </label>

        <label for="notesContains">
            Notes
            <input id="notesContains" name="notesContains" type="text" autocomplete="off" placeholder="search notes">
        </label>

        <label for="notesGeneralNotEmpty">
            Notes (General) is not empty
            <input type="checkbox" id="notesGeneralNotEmpty" name="notesGeneralNotEmpty">
        </label>
        
        <label for="outsideTasksNotEmpty">
            Outside tasks is not empty
            <input type="checkbox" id="outsideTasksNotEmpty" name="outsideTasksNotEmpty">
        </label>
        
        <label for="insideTasksNotEmpty">
            Inside tasks is not empty
            <input type="checkbox" id="insideTasksNotEmpty" name="insideTasksNotEmpty">
        </label>

        <div class="form-buttons">
            <button type="submit">Search</button>
            <button type="button" id="clearBtn">Clear</button>
        </div>
    </form>

    <p id="message" class="message" role="alert"></p>

    <div id="results"></div>

    <script src="/js/shared-frontend.js"></script>
    <script src="/forms/filtered-list.js"></script>
    
</body>

</html>
